name: Publish Halo Cask

on:
  push:
    tags:
      - 'publish-cask/halo'

permissions:
  contents: write

concurrency:
  group: publish-cask-halo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/generate-cask.spec.mjs
          manifest='.publish/manifest.json'
          test "$(jq -r '.token' "$manifest")" = halo
          test "$(jq -r '.repository' "$manifest")" = Yibo-Zhang/homebrew-tap
          test "$(jq -r '.releaseTagPrefix' "$manifest")" = halo-v
          test "$(jq -r '.assetPrefix' "$manifest")" = Halo
          test "$(jq -r '.app' "$manifest")" = Halo.app
          node scripts/generate-cask.mjs "$manifest" "$RUNNER_TEMP/halo.rb"
          version="$(jq -r '.version' "$manifest")"
          asset="Halo-${version}-arm64.zip"
          test "$(sha256sum ".publish/assets/$asset" | cut -d ' ' -f 1)" = "$(jq -r '.sha256' "$manifest")"
          cp ".publish/assets/$asset" "$RUNNER_TEMP/$asset"
          printf 'version=%s\nasset=%s\n' "$version" "$asset" >> "$GITHUB_OUTPUT"

      - name: Publish public versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.payload.outputs.version }}
          ASSET: ${{ steps.payload.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          tag="halo-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing"
            gh release download "$tag" --pattern "$ASSET" --dir "$RUNNER_TEMP/existing"
            cmp "$RUNNER_TEMP/$ASSET" "$RUNNER_TEMP/existing/$ASSET"
          else
            # Keep release tags on main; the ingestion commit contains only a temporary payload.
            gh release create "$tag" "$RUNNER_TEMP/$ASSET" --target main \
              --title "Halo $VERSION" --latest=false \
              --notes 'Apple Silicon macOS 14+ app. Ad-hoc signed, not notarized. Binaries are proprietary; source is not included.'
          fi

      - name: Commit cask to main
        env:
          VERSION: ${{ steps.payload.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --create cask-update origin/main
          mkdir -p Casks
          cp "$RUNNER_TEMP/halo.rb" Casks/halo.rb
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/halo.rb
          if ! git diff --cached --quiet; then
            git commit -m "halo: update to $VERSION"
          fi
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 3
            git fetch origin main
            git rebase origin/main
          done

  verify:
    needs: publish
    uses: ./.github/workflows/verify-casks.yml
    permissions:
      contents: read

  cleanup:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Remove successful ingestion tag
        run: git push origin :refs/tags/publish-cask/halo
